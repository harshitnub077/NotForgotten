name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      NOTFORGOTTEN_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch, then dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notforgotten:ci .
      - name: Smoke test
        run: |
          docker run -d --name nf -p 8080:8080 -e NOTFORGOTTEN_OFFLINE=1 notforgotten:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/ | grep -q "NotForgotten"
