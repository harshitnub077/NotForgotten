name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nf
          POSTGRES_PASSWORD: nf
          POSTGRES_DB: notforgotten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NOTFORGOTTEN_OFFLINE: "1"
      DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://nf:nf@localhost:5432/notforgotten_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU-only torch, then dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test (${{ matrix.db }})
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t notforgotten:ci .
      - name: Smoke test
        run: |
          # Run as uid 1000, like Hugging Face Spaces, to catch permission problems.
          docker run -d --name nf --user 1000 -p 8080:8080 -e NOTFORGOTTEN_OFFLINE=1 notforgotten:ci
          for i in $(seq 1 60); do curl -sf localhost:8080/api/health && break; sleep 2; done
          curl -sf localhost:8080/api/health
          curl -sf localhost:8080/ | grep -q "NotForgotten"
          # Sign up and import a note end to end inside the container.
          curl -sf -c jar -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-password-1","name":"CI"}' localhost:8080/api/auth/signup
          python3 -c "import json; print(json.dumps({'title': 'Cells', 'text': open('assets/demo/cell-energy.md').read()}))" > note.json
          JOB=$(curl -sf -b jar -H 'Content-Type: application/json' -d @note.json localhost:8080/api/documents/text \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['job_id'])")
          for i in $(seq 1 90); do
            STATUS=$(curl -sf -b jar localhost:8080/api/jobs/$JOB | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            [ "$STATUS" != "running" ] && break; sleep 2
          done
          echo "import status: $STATUS"; [ "$STATUS" = "done" ] || (docker logs nf; exit 1)
