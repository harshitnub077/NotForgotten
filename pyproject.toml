[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ingestion", "memory", "retrieval", "agent", "knowledge_graph", "api"]
omit = ["tests/*", "**/__init__.py"]
